{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold" style="color: #2c7a7b;">Your Patients</h2>
</div>

<form method="get" class="mb-4">
    <div class="input-group">
        <input type="text" name="q" class="form-control" placeholder="Search patient by name..." value="{{ query }}">
        <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i> Search</button>
    </div>
</form>

<div class="row g-4">
    {% for patient in patients %}
        <div class="col-md-4">
            <div class="card p-3 h-100">
                <div class="card-body">
                    <h5 class="card-title fw-semibold">{{ patient.name }}</h5>
                    <p class="text-muted mb-1"><i class="bi bi-person"></i> {{ patient.age }} yrs</p>
                    <p class="text-muted mb-1"><i class="bi bi-clipboard2-pulse"></i> {{ patient.diagnosis }}</p>
                    <p class="text-muted mb-3"><i class="bi bi-key"></i> ID: <strong>{{ patient.admission_id }}</strong></p>
                    <div class="d-flex gap-2">
                        <a href="{% url 'patient_detail' patient.pk %}" class="btn btn-sm btn-outline-info flex-fill">View</a>
                        <a href="{% url 'patient_report' patient.pk %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-download"></i></a>
                    </div>
                </div>
            </div>
        </div>
    {% empty %}
        <p class="text-muted">No patients added yet.</p>
    {% endfor %}
</div>

<script>
    const motivationMessages = {{ motivation_messages_json|safe }};

    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    function checkDailyMotivation() {
        const now = new Date();
        const currentTime = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

        if (currentTime === "07:00") {
            const message = motivationMessages[Math.floor(Math.random() * motivationMessages.length)];
            if (Notification.permission === "granted") {
                new Notification("🌞 Today's Motivation", { body: message });
            } else {
                alert(message);
            }
        }
    }

    setInterval(checkDailyMotivation, 30000);
</script>
{% endblock %}
