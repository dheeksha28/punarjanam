{% extends "base.html" %}
{% block content %}
<div class="card p-4">
    <h3>Delete "{{ medicine.medicine_name }}"?</h3>
    <p class="text-muted">Are you sure you want to delete this medicine record? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'patient_detail' medicine.patient.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
