{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="fw-bold mb-4" style="color:#2c7a7b;">
                {% if form.instance.pk %}Edit Treatment{% else %}Add Treatment for {{ patient.name }}{% endif %}
            </h3>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg"></i> Save</button>
            </form>
            <a href="{% url 'patient_detail' patient.pk %}" class="btn btn-outline-secondary mt-3">Back to patient</a>
        </div>
    </div>
</div>

{% endblock %}
