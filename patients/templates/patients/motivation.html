{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-5 text-center" style="background: linear-gradient(135deg, #2c7a7b, #38a3a5); color: white;">
            <i class="bi bi-sun-fill fs-1 mb-3"></i>
            <h3 class="fw-bold mb-3">Today's Motivation</h3>
            <p class="fs-5" style="font-style: italic;">{{ message }}</p>
        </div>
        <div class="text-center mt-4">
            <a href="{% url 'patient_list' %}" class="btn btn-outline-dark">Back to patients</a>
        </div>
    </div>
</div>

{% endblock %}
