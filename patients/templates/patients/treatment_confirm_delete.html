{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 border border-danger">
            <h3 class="fw-bold text-danger mb-3"><i class="bi bi-exclamation-triangle"></i> Delete "{{ treatment.treatment_name }}"?</h3>
            <p class="text-muted">Are you sure you want to delete this treatment record? This cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, delete</button>
                <a href="{% url 'patient_detail' treatment.patient.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
