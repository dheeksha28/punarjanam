{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="fw-bold mb-1" style="color:#2c7a7b;"><i class="bi bi-stars"></i> Ask AI about patients</h3>
            <p class="text-muted mb-4">Ask a natural-language question about any patient's records, treatments, or medicines.</p>

            <form method="post" class="d-flex gap-2 mb-4">
                {% csrf_token %}
                <input type="text" name="question" class="form-control" placeholder="e.g. What treatments has any patient received?" value="{{ question|default:'' }}" required>
                <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Ask</button>
            </form>

            {% if answer %}
                <div class="card bg-light p-3">
                    <p class="fw-semibold mb-1"><i class="bi bi-question-circle"></i> {{ question }}</p>
                    <hr>
                    <p class="mb-0"><i class="bi bi-robot text-success"></i> {{ answer }}</p>
                </div>
            {% endif %}
        </div>
    </div>
</div>

{% endblock %}
